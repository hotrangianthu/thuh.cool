image: node:20-alpine

stages:
  - build
  - deploy

build:
  stage: build
  script:
    - npm ci
    - npm run build
  artifacts:
    paths:
      - out/
  cache:
    paths:
      - node_modules/

pages:
  stage: deploy
  script:
    - cp -r out public
  artifacts:
    paths:
      - public
  only:
    - main
